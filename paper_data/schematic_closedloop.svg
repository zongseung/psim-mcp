<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" style="background:#fafafa; border:1px solid #ddd; border-radius:8px;">
  <style>
    .blk  { fill:#fff; stroke:#2c3e50; stroke-width:1.5; }
    .pwr  { fill:#fff5e6; stroke:#d35400; stroke-width:1.8; }
    .ctl  { fill:#eaf4fd; stroke:#2980b9; stroke-width:1.8; }
    .llm  { fill:#fef3c7; stroke:#b45309; stroke-width:2.2; }
    .lbl  { font-family:sans-serif; font-size:12px; fill:#2c3e50; }
    .sm   { font-family:sans-serif; font-size:10px; fill:#555; }
    .arrow{ stroke:#2c3e50; stroke-width:1.4; fill:none; marker-end:url(#a); }
    .fb   { stroke:#2980b9; stroke-width:1.4; fill:none; marker-end:url(#a); stroke-dasharray:4 3; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2c3e50"/>
    </marker>
  </defs>

  <!-- Power stage -->
  <rect x="20"  y="30"  width="70" height="60" class="pwr"/>
  <text x="55"  y="55"  text-anchor="middle" class="lbl">V_in</text>
  <text x="55"  y="72"  text-anchor="middle" class="sm">48 V</text>

  <rect x="125" y="30"  width="100" height="60" class="pwr"/>
  <text x="175" y="52"  text-anchor="middle" class="lbl">Half-bridge</text>
  <text x="175" y="68"  text-anchor="middle" class="sm">Q1 / Q2</text>
  <text x="175" y="82"  text-anchor="middle" class="sm">(MOSFET)</text>

  <rect x="260" y="30"  width="60"  height="60" class="pwr"/>
  <text x="290" y="55"  text-anchor="middle" class="lbl">L1</text>
  <text x="290" y="72"  text-anchor="middle" class="sm">47 µH</text>

  <rect x="355" y="30"  width="70"  height="60" class="pwr"/>
  <text x="390" y="50"  text-anchor="middle" class="lbl">C1 / R_load</text>
  <text x="390" y="66"  text-anchor="middle" class="sm">100 µF / 5 Ω</text>

  <rect x="460" y="30"  width="60"  height="60" class="pwr"/>
  <text x="490" y="55"  text-anchor="middle" class="lbl">V_out</text>
  <text x="490" y="72"  text-anchor="middle" class="sm">18 V</text>

  <line x1="90"  y1="60" x2="125" y2="60" class="arrow"/>
  <line x1="225" y1="60" x2="260" y2="60" class="arrow"/>
  <line x1="320" y1="60" x2="355" y2="60" class="arrow"/>
  <line x1="425" y1="60" x2="460" y2="60" class="arrow"/>

  <!-- I_sense pickup -->
  <circle cx="290" cy="105" r="3" fill="#2980b9"/>
  <line x1="290" y1="90" x2="290" y2="160" class="fb"/>

  <!-- ADC sampler (SSCB6) -->
  <rect x="240" y="160" width="100" height="50" class="ctl"/>
  <text x="290" y="180" text-anchor="middle" class="lbl">SSCB6 (ADC)</text>
  <text x="290" y="196" text-anchor="middle" class="sm">778 cnt/A</text>

  <!-- LLM-written PI (SSCB7) -->
  <rect x="170" y="240" width="180" height="60" class="llm"/>
  <text x="260" y="262" text-anchor="middle" class="lbl" font-weight="bold">SSCB7 — LLM-written PI</text>
  <text x="260" y="278" text-anchor="middle" class="sm">K_p=0.02 A⁻¹, T_i=1 ms</text>
  <text x="260" y="292" text-anchor="middle" class="sm">ap_start gating + anti-windup</text>

  <!-- IL_ref (target) -->
  <rect x="20"  y="240" width="100" height="60" class="ctl"/>
  <text x="70"  y="265" text-anchor="middle" class="lbl">IL_ref</text>
  <text x="70"  y="283" text-anchor="middle" class="sm">2800 counts (3.6 A)</text>

  <!-- PWM generator (SSCB5) -->
  <rect x="380" y="240" width="100" height="60" class="ctl"/>
  <text x="430" y="262" text-anchor="middle" class="lbl">SSCB5 (PWM)</text>
  <text x="430" y="280" text-anchor="middle" class="sm">duty word → Q1/Q2</text>

  <!-- Connections among control blocks -->
  <line x1="120" y1="270" x2="170" y2="270" class="arrow"/>
  <line x1="350" y1="270" x2="380" y2="270" class="arrow"/>
  <line x1="290" y1="210" x2="290" y2="240" class="arrow"/>
  <line x1="430" y1="240" x2="430" y2="120" class="fb" />
  <line x1="430" y1="120" x2="175" y2="120" class="fb"/>
  <line x1="175" y1="120" x2="175" y2="90"  class="arrow"/>
  <text x="300" y="135" class="sm">PWM gate ↑</text>

  <text x="160" y="262" class="sm">x1</text>
  <text x="360" y="262" class="sm">y1</text>
  <text x="295" y="232" class="sm">x2 (IL_digital)</text>

  <!-- Section labels -->
  <text x="20"  y="20"  class="lbl" font-weight="bold">Power stage</text>
  <text x="20"  y="230" class="lbl" font-weight="bold">Digital control (PSIM chassis)</text>
</svg>
